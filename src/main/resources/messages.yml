# Textes des dialogues (sans préfixe). Codes & et &#RRGGBB acceptés.
# Variables : %item_name% %seller% %min_bid% %current_bid% %highest_bidder% %time_left% (et %max% pour la raison).
dialogues:
  # Publication d'une recherche (onglet Recherches de l'HDV). %max% = longueur maximale.
  recherche:
    titre: '&8&lNouvelle recherche'
    corps:
      - '&7Écrivez ce que vous cherchez, avec la quantité'
      - '&7et votre prix si vous voulez (%max% caractères max).'
      - '&8Exemple : 10 stacks de sable, 500 SHC le stack'
    champ: '&7Je cherche...'
    valider: '&a&lPublier'
    annuler: '&c&lAnnuler'
  enchere:
    titre: '&#F9C572&lMiser sur cette enchère'
    corps:
      - '&7Objet : &e%item_name%'
      - '&7Vendeur : &e%seller%'
      - '&7Meilleure offre : &e%current_bid%'
      - '&7Meilleur enchérisseur : &e%highest_bidder%'
      - '&7Mise minimum : &e%min_bid%'
      - '&7Temps restant : &e%time_left%'
    champ: '&fVotre mise &7(ex : 2500 ou 2500,50)'
    valider: '&a&lMiser'
    annuler: '&c&lAnnuler'
  annulation:
    titre: '&c&lAnnuler cette annonce'
    corps:
      - '&7Objet : &e%item_name%'
      - '&7Vendeur : &e%seller%'
      - '&7La raison sera communiquée au vendeur.'
    champ: '&fRaison de l''annulation &7(%max% caractères maximum)'
    valider: '&c&lAnnuler l''annonce'
    annuler: '&7Retour'
  erreurs:
    montant-invalide: '&cMontant invalide : saisissez un nombre positif (ex : 2500).'
    raison-vide: '&cLa raison ne peut pas être vide.'
    raison-invalide: '&cRaison invalide : %max% caractères maximum, sans caractère spécial.'

