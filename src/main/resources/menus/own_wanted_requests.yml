# Vue « Vos recherches » de l'HDV (/hdv recherche mes) : les recherches en cours du joueur.
# Un clic (gauche ou droit) sur une recherche l'annule. Placeholders comme dans wanted_requests.yml.
title: "&8&lHDV &8| Vos recherches ({currentPage}/{totalPages})"
size: 54

auction_item_slots:
  - 10
  - 11
  - 12
  - 13
  - 14
  - 15
  - 16
  - 19
  - 20
  - 21
  - 22
  - 23
  - 24
  - 25
  - 28
  - 29
  - 30
  - 31
  - 32
  - 33
  - 34
  - 37
  - 38
  - 39
  - 40
  - 41
  - 42
  - 43

auction_item_format:
  material: PAPER
  name: "&6Votre recherche"
  lore:
    - "&f&m                                       &r"
    - "&f{Text}"
    - ""
    - "&7Publiée le &f{Created}"
    - "&7Expire dans &f{ExpiresIn}"
    - "&f&m                                       &r"
    - "{Action}"

items:
  '45':
    material: PAPER
    name: "&c⤾ Retour &7(clic)"
    action:
      type: OPEN_MENU
      value: "main_auction_house"
  '48':
    material: ARROW
    name: "&fPage Précédente"
    action:
      type: PREVIOUS_PAGE
  '49':
    material: WRITABLE_BOOK
    name: "&a&lPublier une recherche"
    lore:
      - "&7"
      - "&8&l« &fÉcrivez ce que vous cherchez : les"
      - "&fautres joueurs pourront vous contacter. &8&l»"
      - ""
      - "&8• &fOu : &a/hdv recherche <ce que vous cherchez>"
    action:
      type: COMMAND
      value: "player:hdv recherche nouvelle"
  '50':
    material: ARROW
    name: "&fPage Suivante"
    action:
      type: NEXT_PAGE
  '53':
    material: WRITABLE_BOOK
    name: "&e&lToutes les recherches"
    lore:
      - "&7Voir ce que cherchent les autres joueurs."
    action:
      type: OPEN_MENU
      value: "wanted_requests"
  '-1':
    material: GLASS_BOTTLE
    name: "&7Aucune recherche en cours"
    lore:
      - "&7Vous n'avez publié aucune recherche."

options:
  open_sound: "BLOCK_CHEST_OPEN"
  # Vitre posée dans les cases vides (hors cases des recherches)
  filler_material: GRAY_STAINED_GLASS_PANE
  # Case de l'item « aucune recherche »
  empty_slot: 22
