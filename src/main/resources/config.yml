# ============================================================================
#  SHAuctions — Hôtel des ventes & Enchères
# ============================================================================
#
#  COMMANDES  (commande principale : /hdv, alias : /ah, /auctionhouse)
#  ----------------------------------------------------------------------------
#   /hdv                         Ouvre l'hôtel des ventes.
#   /hdv sell <prix> [durée]     Met en vente directe l'item en main.
#   /hdv bid <prix> [durée]      Met aux enchères l'item en main (alias : enchere, e).
#                                Après la mise en enchère, deux boutons cliquables
#                                proposent d'ANNONCER l'enchère à tout le serveur.
#   /hdv history                 Historique des ventes ET enchères remportées.
#   /hdv expired                 Vos invendus à récupérer (ventes et enchères).
#   /hdv ownsales                Vos objets en vente / aux enchères en cours.
#   /hdv announce [no]           Annonce à tout le serveur l'enchère qui vient d'être listée,
#                                ou ignore la proposition.
#   /hdv recherche [mes|nouvelle|<texte>]
#                                Recherches des joueurs : voir, publier les siennes.
#   /hdv encheres                Ouvre directement la page Enchères (alias : enchères, bids).
#   (Mise sur une enchère : clic gauche sur l'item dans la page Enchères, puis montant saisi dans
#    un dialogue (clients 1.21.6+, voir « dialogues » plus bas) ou, pour les clients plus anciens, dans le chat.
#    Annulation staff : clic droit sur l'item dans le GUI, puis raison saisie de la même façon.
#    Aucun identifiant d'enchère n'est jamais exposé aux joueurs ni au staff.)
#
#  ADMINISTRATION  (racine /shauctions, console comprise ; pas d'alias)
#  ----------------------------------------------------------------------------
#   /shauctions reload           Recharge config.yml, messages.yml et les 8 menus/*.yml. Un fichier illisible
#                                ne change rien : le message donne le fichier et l'erreur. Replanifie la tâche des
#                                échéances. Les sections reseau, database et economy.use_vault demandent un
#                                redémarrage. Les données (ventes, invendus, historique, recherches) ne sont
#                                jamais touchées. (/hdv reload reste accepté.)
#   /shauctions info <joueur>    Ventes, enchères, invendus et ventes terminées d'un joueur, avec ses limites
#                                s'il est connecté.
#   /shauctions plan             Planning de la semaine des enchères du serveur (voir encheres-serveur).
#   /shauctions launch <lot|random> [durée]
#                                Lance tout de suite une enchère du serveur sur ce lot (random = tirage au sort),
#                                hors planning. Durée au format de /hdv bid (2m, 1h30m, 3 = 3 h) ; sans durée,
#                                tirée dans encheres-serveur.duree-minutes.
#   /shauctions skip             Retire du planning la prochaine enchère du serveur prévue.
#
#  PERMISSIONS
#  ----------------------------------------------------------------------------
#   shauctions.use              Utiliser l'HDV (ouvrir, voir).           [true]
#   shauctions.sell             Mettre des items en vente.               [true]
#   shauctions.buy              Acheter des items.                       [true]
#   shauctions.bid              Mettre aux enchères et miser.            [true]
#   shauctions.menu.bids        Bouton/page Enchères.                    [true]
#   shauctions.menu.ownsales    Bouton "Vos objets en vente".           [true]
#   shauctions.menu.expired     Bouton "Vos invendus".                  [true]
#   shauctions.menu.history     Bouton "Historique des ventes".         [true]
#   shauctions.history.self     Voir son propre historique.             [true]
#   shauctions.history.global   Voir l'historique global.               [op]
#   shauctions.expired.claim    Réclamer ses items expirés.             [true]
#   shauctions.cancel.self      Annuler ses propres ventes.             [true]
#   shauctions.cancel.others    Annuler les ventes des autres (staff).  [op]
#   shauctions.ownsales.view    /hdv ownsales (la commande, pas le bouton). [op]
#   shauctions.recherches.use   Onglet Recherches de l'HDV.             [true]
#   shauctions.recherches.admin Supprimer toute recherche, sans délai.  [op]
#   shauctions.admin            Parent de toute l'administration :       [op]
#     shauctions.admin.reload     /shauctions reload (et /hdv reload)    [op]
#     shauctions.admin.info       /shauctions info                       [op]
#     shauctions.admin.plan       /shauctions plan                       [op]
#     shauctions.admin.launch     /shauctions launch                     [op]
#     shauctions.admin.skip       /shauctions skip                       [op]
#
#   Limites NUMÉRIQUES (la valeur la plus élevée l'emporte ; sinon la valeur
#   par défaut de config.yml est utilisée) :
#   shauctions.limit.<N>        Nb max de VENTES directes simultanées (N = 1..200).
#   shauctions.limit.unlimited  (ou shauctions.limit.*)  Ventes illimitées.
#   shauctions.bidlimit.<N>     Nb max d'ENCHÈRES simultanées (N = 1..200).
#                               INDÉPENDANT des ventes directes. Ex : un joueur
#                               avec shauctions.limit.3 (3 ventes) et aucune perm
#                               bidlimit garde le défaut d'enchères ci-dessous (1).
#   shauctions.bidlimit.unlimited  (ou shauctions.bidlimit.*)  Enchères illimitées.
#   shauctions.recherches.max.<N>  Nb max de recherches en cours (N = 1..20, au-dessus de recherches.max-par-joueur).
#
#  PLACEHOLDERS
#  ----------------------------------------------------------------------------
#   Ce plugin n'a AUCUNE intégration PlaceholderAPI. Les "placeholders" sont
#   internes :
#     - Menus (fichiers menus/*.yml) : format accolades, ex. {ItemName}, {Price},
#       {StartingPrice}, {CurrentBid}, {HighestBidder}, {NextMinBid},
#       {RemainingTime}, {OwnerName}, {CurrencySymbol}, {currentPage}, {totalPages}.
#     - Messages (messages.yml) : format pourcent, ex. %item_name%, %price%,
#       %amount%, %player%, %seller%, %buyer%, %limit%, %min_bid%, %reason%.
# ============================================================================

# Configuration principale de SHAuctions

# Base de données SQLite (sera créée dans le dossier du plugin)
database:
  filename: shauctions.db

# Mode réseau : avec SHNetwork, un seul hôtel des ventes pour tous les serveurs du réseau. Annonces, ventes,
# invendus et recherches sont dans MariaDB ; un achat, une mise, une annulation ou une échéance n'est réglé que par
# un seul serveur, et un joueur connecté sur un autre serveur reçoit quand même ses avis (surenchère, vente...).
# Les échéances ne tournent que sur un serveur à la fois (le meneur).
# Sans SHNetwork, cette section ne sert pas et la base SQLite ci-dessus reste utilisée.
reseau:
  actif: true
  # Canal du bus SHNetwork : avis aux joueurs, annonces d'enchères, rafraîchissement des menus ouverts
  canal: shauctions
  # Base MariaDB commune (tables shauctions_*). Au premier démarrage en mode réseau, la base SQLite de ce serveur
  # y est reprise une fois pour tout le réseau ; chaque serveur renomme ensuite la sienne en <fichier>.avant-reseau.
  # Si cette base est injoignable, l'HDV se désactive sur ce serveur (jamais de retour à la base SQLite locale).
  base-de-donnees:
    url: "jdbc:mariadb://127.0.0.1:3306/bo_net"
    utilisateur: shauctions
    mot-de-passe: CHANGE_ME
    # Délai maximal de connexion et de réponse de la base, en millisecondes
    delai-ms: 3000

# Économie (via Vault)
economy:
  # Si true, le plugin tentera de se connecter à une économie via Vault.
  # Si false, certaines fonctionnalités (achat/vente) pourraient être désactivées ou fonctionner différemment.
  use_vault: true
  # Nom de la monnaie (utilisé dans les messages, etc.)
  currency_symbol: SHC # Vous pouvez utiliser des codes couleurs comme "&2$"
  currency_name_singular: SHCoin
  currency_name_plural: SHCoins
  # Seuil (montant) à partir duquel les messages (chat) ajoutent une forme abrégée entre parenthèses.
  # Ex: "1,000,000,000 SHC (1 Md)". Voir aussi formatting.abbreviate_* pour les menus.
  detailed_format_threshold: 1000000

# Limites des enchères
auction_limits:
  # Prix minimum pour mettre un item en vente
  min_price: 500.0
  # Prix maximum pour mettre un item en vente (0 pour illimité)
  max_price: 1000000000
  # Durée par défaut d'une enchère en secondes (ex: 86400 = 24 heures)
  default_duration_seconds: 86400
  # Durée minimale d'une enchère en secondes
  min_duration_seconds: 60 # 1 minute
  # Durée maximale d'une enchère en secondes
  max_duration_seconds: 259200 # 3 jours
  # Nombre maximum d'items qu'un joueur peut avoir en vente en même temps.
  # Les permissions "shauctions.limit.X" outrepasse cette valeur.
  # Si un joueur n'a aucune permission "shauctions.limit.X", cette valeur est utilisée.
  default_max_listings_per_player: 1
  # Nombre maximum total d'items dans l'HDV global. (0 pour illimité)
  max_global_listings: 2000

# Enchères (type BID) — page "Enchères" du menu
bids:
  # Prix de départ minimum d'une enchère (défaut : auction_limits.min_price si absent)
  min_starting_price: 500.0
  # Prix de départ maximum d'une enchère, 0 pour illimité (défaut : auction_limits.max_price si absent)
  max_starting_price: 1000000000
  # Incrément minimal entre deux mises successives
  min_bid_increment: 100.0
  # Durée par défaut d'une enchère en secondes (utilisée si aucune durée n'est précisée dans /hdv bid)
  default_duration_seconds: 86400
  # Nombre maximum d'enchères (type BID) qu'un joueur peut avoir simultanément.
  # Limite SÉPARÉE des ventes directes. Les permissions "shauctions.bidlimit.X" outrepassent cette valeur.
  # Ex: un joueur avec 3 ventes directes (shauctions.limit.3) peut avoir en plus 1 enchère par défaut.
  default_max_bid_listings_per_player: 1
  # Protection anti-snipe : une offre placée dans les X dernières secondes repousse la fin de l'enchère.
  # Empêche de "voler" une enchère à la toute dernière seconde.
  # Mettre anti_snipe_seconds à 0 pour désactiver.
  anti_snipe_seconds: 30
  # De combien de secondes l'enchère est prolongée quand l'anti-snipe se déclenche.
  anti_snipe_extension_seconds: 30
  # Texte affiché dans le lore quand aucune mise n'a encore été placée
  no_bid_placeholder: Aucune offre
  # Texte affiché quand il n'y a pas encore de meilleur enchérisseur
  no_bidder_placeholder: —

# Enchères du serveur : quelques fois par semaine, le serveur met lui-même un lot aux enchères dans la page Enchères,
# vendeur affiché « vendeur ». Les joueurs misent comme sur une enchère de joueur (remboursement en cas de surenchère,
# anti-snipe). L'offre gagnante n'est versée à personne : elle sort de l'économie. Le gagnant reçoit le lot par les
# commandes du lot ; s'il est hors ligne ou sans place libre, le lot part dans ses invendus (/hdv expired) et les
# commandes sont lancées quand il le récupère. Sans offre, l'enchère disparaît sans rien faire.
# Planning : chaque lundi 00:00 (heure du serveur), « par-semaine » débuts tirés au hasard dans la plage horaire,
# répartis sur les jours de la semaine et chacun dans une tranche différente de la plage (jamais au même moment
# de la journée). Il est gardé dans encheres-serveur.yml : les redémarrages ne le changent pas. Une enchère dont
# l'heure passe pendant que le serveur est éteint est lancée au démarrage si sa plage horaire n'est pas finie.
# Changer les réglages du planning (par-semaine, plage-horaire, écart, durée) refait la suite de la semaine.
# Mode réseau : seul le serveur où actif vaut true tient le planning et lance les enchères ; tous les serveurs les
# affichent, prennent les mises et peuvent les régler.
encheres-serveur:
  actif: false
  # Nom du vendeur affiché dans l'HDV et dans les annonces
  vendeur: SkyHand
  # Nombre d'enchères du serveur par semaine (la première semaine, au prorata des jours restants)
  par-semaine: 7
  # Plage horaire des débuts, HH:mm. Une fin plus tôt que le début fait passer la plage après minuit.
  plage-horaire:
    debut: "12:00"
    fin: "23:30"
  # Écart minimal entre les débuts de deux enchères du serveur, en minutes
  ecart-minimal-minutes: 240
  # Durée de chaque enchère, tirée entre min et max, en minutes
  duree-minutes:
    min: 180
    max: 360
  # Enchères du serveur qu'un même joueur peut remporter par semaine. Une enchère où il est déjà en tête compte :
  # au plafond, il ne peut plus miser sur une autre. 0 = sans limite.
  max-gagnees-par-joueur: 2
  # Son joué à chaque joueur avec l'annonce d'une nouvelle enchère du serveur (vide = aucun son)
  son-annonce: ""
  # Lots, tirés au sort à chaque enchère au prorata de leur poids :
  #   id              nom court (/shauctions launch, logs, planning)
  #   poids           chance relative d'être tiré (0 = jamais tiré, lançable à la main)
  #   prix-depart     première mise minimale
  #   increment-min   écart minimal entre deux mises sur ce lot (défaut : bids.min_bid_increment)
  #   objet           ce qui est affiché dans l'HDV : materiau, quantite, nom, description (lignes),
  #                   brillant (reflet d'enchantement), texture (base64, pour une PLAYER_HEAD)
  #   commandes       lancées par la console pour le gagnant, %player% = son pseudo
  lots:
    - id: cle-ordinaire
      poids: 40
      prix-depart: 100000
      increment-min: 5000
      objet:
        materiau: TRIPWIRE_HOOK
        quantite: 1
        nom: "&eClé Ordinaire"
        brillant: true
      commandes:
        - shcrates givekey %player% ordinaire 1 physical
    - id: cles-ordinaires-x3
      poids: 15
      prix-depart: 300000
      increment-min: 10000
      objet:
        materiau: TRIPWIRE_HOOK
        quantite: 3
        nom: "&eClé Ordinaire"
        brillant: true
      commandes:
        - shcrates givekey %player% ordinaire 3 physical
    - id: spawner-mystere-commun
      poids: 12
      prix-depart: 250000
      increment-min: 10000
      objet:
        materiau: ENDER_CHEST
        quantite: 1
        nom: "&6Spawner Mystère &7(&eCommun&7)"
      commandes:
        - voucher give mysteryspawner1 1 %player%
    - id: spawner-mystere-rare
      poids: 6
      prix-depart: 800000
      increment-min: 25000
      objet:
        materiau: ENDER_CHEST
        quantite: 1
        nom: "&6Spawner Mystère &7(&5Rare&7)"
      commandes:
        - voucher give mysteryspawner2 1 %player%
    - id: coffre-ameliore-moyen
      poids: 4
      prix-depart: 500000
      increment-min: 20000
      objet:
        materiau: CHEST
        quantite: 1
        nom: "&6Coffre amélioré &f(&6Moyen&f)"
      commandes:
        - advancedchests give %player% moyen 1
    - id: tete-de-wither
      poids: 4
      prix-depart: 400000
      increment-min: 20000
      objet:
        materiau: WITHER_SKELETON_SKULL
        quantite: 1
        nom: "&fTête de Wither"
      commandes:
        - minecraft:give %player% wither_skeleton_skull 1
    - id: ardoises-renforcees-x5
      poids: 6
      prix-depart: 1500000
      increment-min: 50000
      objet:
        materiau: REINFORCED_DEEPSLATE
        quantite: 5
        nom: "&fArdoise des abîmes renforcée"
      commandes:
        - minecraft:give %player% reinforced_deepslate 5
    - id: ancre-teleportation
      poids: 5
