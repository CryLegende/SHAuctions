# Items interdits (blacklist)
# Les joueurs ne pourront pas vendre ces items. Utilisez les noms de matériaux Bukkit.
# Exemple : BEDROCK, COMMAND_BLOCK
item_blacklist:
- COMMAND_BLOCK
- COMMAND_BLOCK_MINECART
- CHAIN_COMMAND_BLOCK
- REPEATING_COMMAND_BLOCK
- STRUCTURE_BLOCK
- STRUCTURE_VOID
- JIGSAW
- BARRIER
- LIGHT
# - "SPAWNER" # Souvent blacklisté

# Options pour les items expirés
expired_items:
  # Combien de temps les items expirés sont conservés avant d'être supprimés définitivement (en secondes).
  # 0 pour une suppression immédiate après expiration (non recommandé si les joueurs doivent pouvoir les récupérer).
  # -1 pour une conservation illimitée (peut remplir la base de données).
  # Ex: 2592000 = 30 jours
  cleanup_after_seconds: 2592000 # 30 jours
  # Notifier le joueur à la connexion s'il a des items expirés à récupérer.
  notify_on_join: true

offline_sales:
  # Récapitulatif à la connexion des ventes faites pendant l'absence du vendeur.
  notify_on_join: true
  # Délai après la connexion, en ticks.
  notification_delay_ticks_on_join: 80

# Formatage de la date et de l'heure
# Utilisez les motifs SimpleDateFormat (https://docs.oracle.com/javase/8/docs/api/java/text/SimpleDateFormat.html)
date_format: dd/MM/yyyy HH:mm:ss # Pour l'expiration, l'historique etc.
time_remaining_format: # Suffixes du temps restant
  days: j
  hours: h
  minutes: m
  seconds: s
# Exemple de sortie : "2j 3h 15m 30s" ou "1h 5m"

display_options:
  # Tri des items dans l'hôtel des ventes principal, historique, etc.
  # Valeurs possibles:
  #   DESC (Descendant): Plus récent/cher en premier (par défaut pour les dates)
  #   ASC (Ascendant): Plus ancien/moins cher en premier
  auction_house_sort_order: DESC # Tri par list_timestamp
  sales_history_sort_order: DESC # Tri par sold_timestamp
  expired_items_sort_order: ASC # Tri par expiration_timestamp (pour voir les plus anciens à récupérer en premier)
  own_sales_sort_order: DESC # Tri par list_timestamp

formatting:
  # Format pour afficher les prix. Utilise java.text.DecimalFormat.
  # Voir: https://docs.oracle.com/javase/8/docs/api/java/text/DecimalFormat.html
  # Exemple: "#,##0.00" -> 1,234.56 ou 0.50
  price_format: '###,###,###'
  # Pour les gros prix, ajouter une forme abrégée entre parenthèses dans les menus.
  # Ex: "1,000,000,000 (1 Md)". k = millier, M = million, Md = milliard.
  abbreviate_large_prices: true
  # Seuil (montant) à partir duquel la forme abrégée est ajoutée.
  abbreviate_threshold: 1000000

# Tâches planifiées
tasks:
  # Intervalle de vérification des items expirés, en secondes.
  expiration_check_interval_seconds: 300 # 5 minutes

# Options diverses
misc:
  # Permettre d'annuler ses propres ventes
  allow_self_cancel: true
  # Permettre aux admins (permission shauctions.cancel.others) d'annuler les ventes des autres
  allow_admin_cancel: true
  # Logguer les transactions (achats) dans la console
  log_transactions: true
  # Son joué lors d'un achat réussi (vide pour aucun son)
  # Voir: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Sound.html
  sound_on_purchase: ENTITY_PLAYER_LEVELUP
  sound_on_sell: ENTITY_EXPERIENCE_ORB_PICKUP
  sound_on_cancel: BLOCK_ANVIL_LAND
  sound_on_expire_claim: ENTITY_ITEM_PICKUP

# Saisie par dialogue natif (clients 1.21.6 et plus) : montant d'une mise et raison d'une annulation staff.
# Les clients plus anciens (ou actif: false) gardent la saisie dans le chat (« annuler » pour abandonner).
# Les textes des dialogues se règlent dans messages.yml, section « dialogues ».
# Le montant saisi est revérifié par le serveur avec les mêmes règles qu'au chat (minimum, incrément, solde...).
dialogues:
  # false : tous les joueurs saisissent dans le chat
  actif: true
  # Version de protocole minimale du client pour recevoir un dialogue (771 = 1.21.6).
  # Sans ViaVersion, tous les clients sont considérés compatibles.
  min-protocol: 771
  # Durée de validité d'un dialogue ouvert, en secondes : passé ce délai, valider ne fait plus rien
  expiration-secondes: 300

# Onglet « Recherches » (/hdv recherche) : les joueurs publient ce qu'ils cherchent, les autres les contactent
# par mail (même hors ligne). Aucun argent ni objet ne bouge. Publications et suppressions écrites dans la console.
recherches:
  actif: true
  # Recherches en cours par joueur (permission shauctions.recherches.max.<n> pour plus, jusqu'à 20)
  max-par-joueur: 3
  # Durée de vie d'une recherche, en heures
  duree-heures: 72
  # Délai minimal entre deux publications, en secondes (le staff n'y est pas soumis)
  delai-secondes: 30
  longueur-min: 3
  longueur-max: 80
  # Commande suggérée par le bouton « Lui écrire » (%auteur% = auteur de la recherche)
  commande-contact: '/mail %auteur% '
  # Mots refusés (contenus dans le texte, sans tenir compte des majuscules)
  mots-interdits:
    - discord.gg
    - http://
    - https://

# Lignes écrites dans SHLogs (plugins/SHLogs/SHAuctions/).
# file : nom du fichier de log. format : ligne écrite.
# %price% est le montant exact, sans arrondi à l'entier ni abréviation.
logs:
  # Mise en vente directe.
  # Variables : %player%, %amount%, %item%, %price%, %duration%.
  mises-en-vente:
    file: "mises-en-vente"
    format: "%player% -> met en vente %amount% x %item% (%price% SHCoins, durée %duration%)"
  # Mise aux enchères.
  # Variables : %player%, %amount%, %item%, %price% (prix de départ), %duration%.
  mises-aux-encheres:
    file: "mises-en-vente"
    format: "%player% -> met aux enchères %amount% x %item% (départ %price% SHCoins, durée %duration%)"
  # Achat d'une vente directe.
  # Variables : %buyer%, %seller%, %amount%, %item%, %price%.
  achats:
    file: "achats"
    format: "%buyer% -> achète %amount% x %item% à %seller% (%price% SHCoins)"
  # Enchère terminée avec un gagnant (enchères du serveur comprises, vendeur = encheres-serveur.vendeur).
  # Variables : %winner%, %seller%, %amount%, %item%, %price% (montant final).
  encheres:
    file: "encheres"
    format: "%winner% -> remporte %amount% x %item% de %seller% (%price% SHCoins)"
  # Mise acceptée sur une enchère.
  # Variables : %player%, %seller%, %amount%, %item%, %price% (montant misé).
  mises:
    file: "encheres"
    format: "%player% -> mise %price% SHCoins sur %amount% x %item% de %seller%"
  # Enchère du serveur mise en ligne.
  # Variables : %lot%, %item% (avec la quantité), %price% (départ), %duration%.
  encheres-serveur-lancement:
    file: "encheres-serveur"
    format: "%lot% -> mis aux enchères par le serveur : %item% (départ %price% SHCoins, durée %duration%)"
  # Lot remis au gagnant (commandes lancées), tout de suite ou quand il le récupère dans ses invendus.
  # Variables : %player%, %lot%, %item%.
  encheres-serveur-livraison:
    file: "encheres-serveur"
    format: "%player% -> reçoit le lot %lot% (%item%)"
  # Enchère du serveur terminée sans offre.
  # Variables : %item%, %price% (départ).
  encheres-serveur-sans-offre:
    file: "encheres-serveur"
    format: "%item% -> enchère du serveur terminée sans offre (départ %price% SHCoins)"
  # Annonce retirée par son vendeur.
  # Variables : %player%, %amount%, %item%.
  retraits:
    file: "retraits"
    format: "%player% -> retire son annonce (%amount% x %item%)"
  # Objet récupéré dans le menu des invendus.
  # Variables : %player%, %amount%, %item%.
  retraits-invendus:
    file: "retraits"
    format: "%player% -> récupère ses invendus (%amount% x %item%)"
  # Annonce annulée par le staff.
  # Variables : %staff%, %seller%, %amount%, %item%, %reason%.
  staff:
    file: "staff"
    format: "%staff% -> annule l'annonce de %seller% (%amount% x %item%, raison : %reason%)"
