# ============================================================================
#  SHAuctions — Hôtel des ventes & Enchères
# ============================================================================
#
#  COMMANDES  (commande principale : /hdv, alias : /ah, /auctionhouse)
#  ----------------------------------------------------------------------------
#   /hdv                         Ouvre l'hôtel des ventes.
#   /hdv sell <prix> [durée]     Met en vente directe l'item en main.
#   /hdv bid <prix> [durée]      Met aux enchères l'item en main (alias : enchere, e).
#                                Après la mise en enchère, deux boutons cliquables
#                                proposent d'ANNONCER l'enchère à tout le serveur.
#   /hdv history                 Historique des ventes ET enchères remportées.
#   /hdv expired                 Vos invendus à récupérer (ventes et enchères).
#   /hdv ownsales                Vos objets en vente / aux enchères en cours.
#   /hdv announce [no]           Annonce à tout le serveur l'enchère qui vient d'être listée,
#                                ou ignore la proposition.
#   /hdv recherche [mes|nouvelle|<texte>]
#                                Recherches des joueurs : voir, publier les siennes.
#   /hdv encheres                Ouvre directement la page Enchères (alias : enchères, bids).
#   (Mise sur une enchère : clic gauche sur l'item dans la page Enchères, puis montant saisi dans
#    un dialogue (clients 1.21.6+, voir « dialogues » plus bas) ou, pour les clients plus anciens, dans le chat.
#    Annulation staff : clic droit sur l'item dans le GUI, puis raison saisie de la même façon.
#    Aucun identifiant d'enchère n'est jamais exposé aux joueurs ni au staff.)
#
#  ADMINISTRATION  (racine /shauctions, console comprise ; pas d'alias)
#  ----------------------------------------------------------------------------
#   /shauctions reload           Recharge config.yml, messages.yml et les 8 menus/*.yml. Un fichier illisible
#                                ne change rien : le message donne le fichier et l'erreur. Replanifie la tâche des
#                                échéances. Les sections reseau, database et economy.use_vault demandent un
#                                redémarrage. Les données (ventes, invendus, historique, recherches) ne sont
#                                jamais touchées. (/hdv reload reste accepté.)
#   /shauctions info <joueur>    Ventes, enchères, invendus et ventes terminées d'un joueur, avec ses limites
#                                s'il est connecté.
#   /shauctions plan             Planning de la semaine des enchères et ventes du serveur (encheres-serveur,
#                                ventes-serveur).
#   /shauctions launch [vente] <lot|random> [durée]
#                                Lance tout de suite une enchère du serveur (une vente avec « vente ») sur ce lot,
#                                random = tirage au sort, hors planning. Durée au format de /hdv bid (2m, 1h30m,
#                                3 = 3 h) ; sans durée, tirée dans duree-minutes de la section.
#   /shauctions skip [enchere|vente]
#                                Retire du planning la prochaine enchère ou vente du serveur prévue (la prochaine
#                                des deux sans précision).
#
#  PERMISSIONS
#  ----------------------------------------------------------------------------
#   shauctions.use              Utiliser l'HDV (ouvrir, voir).           [true]
#   shauctions.sell             Mettre des items en vente.               [true]
#   shauctions.buy              Acheter des items.                       [true]
#   shauctions.bid              Mettre aux enchères et miser.            [true]
#   shauctions.menu.bids        Bouton/page Enchères.                    [true]
#   shauctions.menu.ownsales    Bouton "Vos objets en vente".           [true]
#   shauctions.menu.expired     Bouton "Vos invendus".                  [true]
#   shauctions.menu.history     Bouton "Historique des ventes".         [true]
#   shauctions.history.self     Voir son propre historique.             [true]
#   shauctions.history.global   Voir l'historique global.               [op]
#   shauctions.expired.claim    Réclamer ses items expirés.             [true]
#   shauctions.cancel.self      Annuler ses propres ventes.             [true]
#   shauctions.cancel.others    Annuler les ventes des autres (staff).  [op]
#   shauctions.ownsales.view    /hdv ownsales (la commande, pas le bouton). [op]
#   shauctions.recherches.use   Onglet Recherches de l'HDV.             [true]
#   shauctions.recherches.admin Supprimer toute recherche, sans délai.  [op]
#   shauctions.admin            Parent de toute l'administration :       [op]
#     shauctions.admin.reload     /shauctions reload (et /hdv reload)    [op]
#     shauctions.admin.info       /shauctions info                       [op]
#     shauctions.admin.plan       /shauctions plan                       [op]
#     shauctions.admin.launch     /shauctions launch                     [op]
#     shauctions.admin.skip       /shauctions skip                       [op]
#
#   Limites NUMÉRIQUES (la valeur la plus élevée l'emporte ; sinon la valeur
#   par défaut de config.yml est utilisée) :
#   shauctions.limit.<N>        Nb max de VENTES directes simultanées (N = 1..200).
#   shauctions.limit.unlimited  (ou shauctions.limit.*)  Ventes illimitées.
#   shauctions.bidlimit.<N>     Nb max d'ENCHÈRES simultanées (N = 1..200).
#                               INDÉPENDANT des ventes directes. Ex : un joueur
#                               avec shauctions.limit.3 (3 ventes) et aucune perm
#                               bidlimit garde le défaut d'enchères ci-dessous (1).
#   shauctions.bidlimit.unlimited  (ou shauctions.bidlimit.*)  Enchères illimitées.
#   shauctions.recherches.max.<N>  Nb max de recherches en cours (N = 1..20, au-dessus de recherches.max-par-joueur).
#
#  PLACEHOLDERS
#  ----------------------------------------------------------------------------
#   Ce plugin n'a AUCUNE intégration PlaceholderAPI. Les "placeholders" sont
#   internes :
#     - Menus (fichiers menus/*.yml) : format accolades, ex. {ItemName}, {Price},
#       {StartingPrice}, {CurrentBid}, {HighestBidder}, {NextMinBid},
#       {RemainingTime}, {OwnerName}, {CurrencySymbol}, {currentPage}, {totalPages}.
#     - Messages (messages.yml) : format pourcent, ex. %item_name%, %price%,
#       %amount%, %player%, %seller%, %buyer%, %limit%, %min_bid%, %reason%.
# ============================================================================

# Configuration principale de SHAuctions

# Base de données SQLite (sera créée dans le dossier du plugin)
database:
  filename: shauctions.db

# Mode réseau : avec SHNetwork, un seul hôtel des ventes pour tous les serveurs du réseau. Annonces, ventes,
# invendus et recherches sont dans MariaDB ; un achat, une mise, une annulation ou une échéance n'est réglé que par
# un seul serveur, et un joueur connecté sur un autre serveur reçoit quand même ses avis (surenchère, vente...).
# Les échéances ne tournent que sur un serveur à la fois (le meneur).
# Sans SHNetwork, cette section ne sert pas et la base SQLite ci-dessus reste utilisée.
reseau:
  actif: true
  # Canal du bus SHNetwork : avis aux joueurs, annonces d'enchères, rafraîchissement des menus ouverts
  canal: shauctions
  # Base MariaDB commune (tables shauctions_*). Au premier démarrage en mode réseau, la base SQLite de ce serveur
  # y est reprise une fois pour tout le réseau ; chaque serveur renomme ensuite la sienne en <fichier>.avant-reseau.
  # Si cette base est injoignable, l'HDV se désactive sur ce serveur (jamais de retour à la base SQLite locale).
  base-de-donnees:
    url: "jdbc:mariadb://127.0.0.1:3306/minecraft"
    utilisateur: shauctions
    mot-de-passe: CHANGE_ME
    # Délai maximal de connexion et de réponse de la base, en millisecondes
    delai-ms: 3000

# Économie (via Vault)
economy:
  # Si true, le plugin tentera de se connecter à une économie via Vault.
  # Si false, certaines fonctionnalités (achat/vente) pourraient être désactivées ou fonctionner différemment.
  use_vault: true
  # Nom de la monnaie (utilisé dans les messages, etc.)
  currency_symbol: $ # Vous pouvez utiliser des codes couleurs comme "&2$"
  currency_name_singular: Pièce
  currency_name_plural: Pièces
  # Seuil (montant) à partir duquel les messages (chat) ajoutent une forme abrégée entre parenthèses.
  # Ex: "1,000,000,000 SHC (1 Md)". Voir aussi formatting.abbreviate_* pour les menus.
  detailed_format_threshold: 1000000

# Limites des enchères
auction_limits:
  # Prix minimum pour mettre un item en vente
  min_price: 100.0
  # Prix maximum pour mettre un item en vente (0 pour illimité)
  max_price: 1000000
  # Durée par défaut d'une enchère en secondes (ex: 86400 = 24 heures)
  default_duration_seconds: 86400
  # Durée minimale d'une enchère en secondes
  min_duration_seconds: 60 # 1 minute
  # Durée maximale d'une enchère en secondes
  max_duration_seconds: 259200 # 3 jours
  # Nombre maximum d'items qu'un joueur peut avoir en vente en même temps.
  # Les permissions "shauctions.limit.X" outrepasse cette valeur.
  # Si un joueur n'a aucune permission "shauctions.limit.X", cette valeur est utilisée.
  default_max_listings_per_player: 1
  # Nombre maximum total d'items dans l'HDV global. (0 pour illimité)
  max_global_listings: 2000

# Enchères (type BID) — page "Enchères" du menu
bids:
  # Prix de départ minimum d'une enchère (défaut : auction_limits.min_price si absent)
  min_starting_price: 100.0
  # Prix de départ maximum d'une enchère, 0 pour illimité (défaut : auction_limits.max_price si absent)
  max_starting_price: 1000000
  # Incrément minimal entre deux mises successives
  min_bid_increment: 10.0
  # Durée par défaut d'une enchère en secondes (utilisée si aucune durée n'est précisée dans /hdv bid)
  default_duration_seconds: 86400
  # Nombre maximum d'enchères (type BID) qu'un joueur peut avoir simultanément.
  # Limite SÉPARÉE des ventes directes. Les permissions "shauctions.bidlimit.X" outrepassent cette valeur.
  # Ex: un joueur avec 3 ventes directes (shauctions.limit.3) peut avoir en plus 1 enchère par défaut.
  default_max_bid_listings_per_player: 1
  # Protection anti-snipe : une offre placée dans les X dernières secondes repousse la fin de l'enchère.
  # Empêche de "voler" une enchère à la toute dernière seconde.
  # Mettre anti_snipe_seconds à 0 pour désactiver.
  anti_snipe_seconds: 30
  # De combien de secondes l'enchère est prolongée quand l'anti-snipe se déclenche.
  anti_snipe_extension_seconds: 30
  # Texte affiché dans le lore quand aucune mise n'a encore été placée
  no_bid_placeholder: Aucune offre
  # Texte affiché quand il n'y a pas encore de meilleur enchérisseur
  no_bidder_placeholder: —

# Enchères du serveur : chaque jour, le serveur met lui-même quelques lots aux enchères dans la page Enchères, vendeur
# affiché « vendeur ». Les joueurs misent comme sur une enchère de joueur (remboursement en cas de surenchère,
# anti-snipe). L'offre gagnante n'est versée à personne : elle sort de l'économie. Le gagnant reçoit le lot par les
# commandes du lot ; s'il est hors ligne ou sans place libre, le lot part dans ses invendus (/hdv expired) et les
# commandes sont lancées quand il le récupère. Sans offre, l'enchère disparaît sans rien faire.
# Planning : chaque lundi 00:00 (heure du serveur), chaque jour de la semaine reçoit entre par-jour.min et par-jour.max
# enchères, à des heures tirées au hasard dans la plage horaire (une par tranche égale de la plage), donc jamais à la
# même heure d'un jour à l'autre. Il est gardé dans encheres-serveur.yml avec celui des ventes : les redémarrages ne
# le changent pas. Une enchère dont l'heure passe serveur éteint est lancée au démarrage si sa plage n'est pas finie.
# Changer ces réglages refait la suite de la semaine (ce qui a déjà été lancé aujourd'hui compte dans le jour).
# Si l'écart minimal ne laisse pas la place d'en mettre autant dans un jour, ce jour en reçoit moins.
# Mode réseau : seul le serveur où actif vaut true tient le planning et lance les enchères ; tous les serveurs les
# affichent, prennent les mises et peuvent les régler.
encheres-serveur:
  actif: false
  # Nom du vendeur affiché dans l'HDV et dans les annonces
  vendeur: Serveur
  # Nombre d'enchères par jour, tiré entre min et max chaque jour (le jour de la mise en route, au prorata de la plage restante)
  par-jour:
    min: 2
    max: 5
  # Plage horaire des débuts, HH:mm. Une fin plus tôt que le début fait passer la plage après minuit.
  plage-horaire:
    debut: "12:00"
    fin: "21:30"
  # Écart minimal entre les débuts de deux enchères du serveur, en minutes
  ecart-minimal-minutes: 90
  # Durée de chaque enchère, tirée entre min et max, en minutes
  duree-minutes:
    min: 120
    max: 180
  # Un lot lancé (enchère ou vente du serveur) depuis moins de ce nombre d'heures n'est pas retiré au sort, sauf s'il ne
  # reste aucun autre lot tirable (0 = aucune limite)
  repetition-minimale-heures: 24
  # Son joué à chaque joueur avec l'annonce d'une nouvelle enchère du serveur (vide = aucun son)
  son-annonce: ""
  # Lots, tirés au sort à chaque enchère au prorata de leur poids :
  #   id              nom court (/shauctions launch, logs, planning)
  #   poids           chance relative d'être tiré (0 = jamais tiré, lançable à la main)
  #   prix-depart     première mise minimale
  #   increment-min   écart minimal entre deux mises sur ce lot (défaut : bids.min_bid_increment)
  #   objet           ce qui est affiché dans l'HDV : materiau, quantite, nom, description (lignes),
  #                   brillant (reflet d'enchantement), texture (base64, pour une PLAYER_HEAD)
  #   commandes       lancées par la console pour le gagnant, %player% = son pseudo
  lots:
    - id: balise
      poids: 3
      prix-depart: 50000
      increment-min: 2500
      objet:
        materiau: BEACON
        quantite: 1
        nom: "&bBalise"
      commandes:
        - "minecraft:give %player% beacon 1"
    - id: livre-raccommodage
      poids: 2
      prix-depart: 20000
      increment-min: 1000
      objet:
        materiau: ENCHANTED_BOOK
        quantite: 1
        nom: "&bLivre &fRaccommodage"
        description:
          - "&7Répare l'objet avec l'expérience"
        brillant: true
      commandes:
        - "minecraft:give %player% enchanted_book[stored_enchantments={\"minecraft:mending\":1}] 1"
    - id: diamants-x16
      poids: 5
      prix-depart: 10000
      increment-min: 500
      objet:
        materiau: DIAMOND
        quantite: 16
        nom: "&bDiamant"
      commandes:
        - "minecraft:give %player% diamond 16"

# Ventes du serveur : chaque jour, le serveur met aussi quelques lots en vente à prix fixe dans la page Ventes, vendeur
# affiché « vendeur ». Un seul exemplaire par vente : il disparaît une fois acheté ou à la fin de sa durée. Le prix
# payé n'est versé à personne. L'acheteur reçoit le lot par les commandes du lot ; inventaire plein : le lot part dans
# ses invendus (/hdv expired) et les commandes sont lancées quand il le récupère.
# Planning : comme les enchères (nombre par jour, plage horaire, gardé dans encheres-serveur.yml), avec l'écart minimal
# gardé aussi avec les débuts des enchères : une vente et une enchère ne tombent pas en même temps.
ventes-serveur:
  actif: false
  # Nom du vendeur affiché dans l'HDV et dans les annonces
  vendeur: Serveur
  # Nombre de ventes par jour, tiré entre min et max chaque jour (le jour de la mise en route, au prorata de la plage restante)
  par-jour:
    min: 2
    max: 5
  # Plage horaire des mises en vente, HH:mm. Une fin plus tôt que le début fait passer la plage après minuit.
  plage-horaire:
    debut: "10:00"
    fin: "23:30"
  # Écart minimal entre deux mises en vente, et entre une mise en vente et le début d'une enchère, en minutes
  ecart-minimal-minutes: 30
  # Durée de mise en vente, tirée entre min et max, en minutes
  duree-minutes:
    min: 360
    max: 720
  # Un lot lancé (enchère ou vente du serveur) depuis moins de ce nombre d'heures n'est pas retiré au sort, sauf s'il ne
  # reste aucun autre lot tirable (0 = aucune limite)
  repetition-minimale-heures: 24
  # Son joué à chaque joueur avec l'annonce d'une nouvelle vente du serveur (vide = aucun son)
  son-annonce: ""
  # Lots, tirés au sort à chaque vente au prorata de leur poids :
  #   id              nom court (/shauctions launch vente, logs, planning)
  #   poids           chance relative d'être tiré (0 = jamais tiré, lançable à la main)
  #   prix            prix fixe
  #   objet           ce qui est affiché dans l'HDV : materiau, quantite, nom, description (lignes),
  #                   brillant (reflet d'enchantement), texture (base64, pour une PLAYER_HEAD)
  #   commandes       lancées par la console pour l'acheteur, %player% = son pseudo
  lots:
    - id: emeraudes-x32
      poids: 5
      prix: 8000
      objet:
        materiau: EMERALD
        quantite: 32
        nom: "&aÉmeraude"
      commandes:
        - "minecraft:give %player% emerald 32"
    - id: xp-30-niveaux
      poids: 3
      prix: 15000
      objet:
        materiau: EXPERIENCE_BOTTLE
        quantite: 1
        nom: "&a30 niveaux d'expérience"
        brillant: true
      commandes:
        - "minecraft:xp add %player% 30 levels"
    - id: tete-de-wither
      poids: 2
      prix: 25000
      objet:
        materiau: WITHER_SKELETON_SKULL
        quantite: 1
        nom: "&8Tête de Wither"
      commandes:
        - "minecraft:give %player% wither_skeleton_skull 1"

# Items interdits (blacklist)
# Les joueurs ne pourront pas vendre ces items. Utilisez les noms de matériaux Bukkit.
# Exemple : BEDROCK, COMMAND_BLOCK
item_blacklist:
- COMMAND_BLOCK
- COMMAND_BLOCK_MINECART
- CHAIN_COMMAND_BLOCK
- REPEATING_COMMAND_BLOCK
- STRUCTURE_BLOCK
- STRUCTURE_VOID
- JIGSAW
- BARRIER
- LIGHT
# - "SPAWNER" # Souvent blacklisté

# Options pour les items expirés
expired_items:
  # Combien de temps les items expirés sont conservés avant d'être supprimés définitivement (en secondes).
  # 0 pour une suppression immédiate après expiration (non recommandé si les joueurs doivent pouvoir les récupérer).
  # -1 pour une conservation illimitée (peut remplir la base de données).
  # Ex: 2592000 = 30 jours
  cleanup_after_seconds: 2592000 # 30 jours
  # Notifier le joueur à la connexion s'il a des items expirés à récupérer.
  notify_on_join: true

offline_sales:
  # Récapitulatif à la connexion des ventes faites pendant l'absence du vendeur.
  notify_on_join: true
  # Délai après la connexion, en ticks.
  notification_delay_ticks_on_join: 80

# Formatage de la date et de l'heure
# Utilisez les motifs SimpleDateFormat (https://docs.oracle.com/javase/8/docs/api/java/text/SimpleDateFormat.html)
date_format: dd/MM/yyyy HH:mm:ss # Pour l'expiration, l'historique etc.
time_remaining_format: # Suffixes du temps restant
  days: j
  hours: h
  minutes: m
  seconds: s
# Exemple de sortie : "2j 3h 15m 30s" ou "1h 5m"

display_options:
  # Tri des items dans l'hôtel des ventes principal, historique, etc.
  # Valeurs possibles:
  #   DESC (Descendant): Plus récent/cher en premier (par défaut pour les dates)
  #   ASC (Ascendant): Plus ancien/moins cher en premier
  auction_house_sort_order: DESC # Tri par list_timestamp
  sales_history_sort_order: DESC # Tri par sold_timestamp
  expired_items_sort_order: ASC # Tri par expiration_timestamp (pour voir les plus anciens à récupérer en premier)
  own_sales_sort_order: DESC # Tri par list_timestamp

formatting:
  # Format pour afficher les prix. Utilise java.text.DecimalFormat.
  # Voir: https://docs.oracle.com/javase/8/docs/api/java/text/DecimalFormat.html
  # Exemple: "#,##0.00" -> 1,234.56 ou 0.50
  price_format: '###,###,###'
  # Pour les gros prix, ajouter une forme abrégée entre parenthèses dans les menus.
  # Ex: "1,000,000,000 (1 Md)". k = millier, M = million, Md = milliard.
  abbreviate_large_prices: true
  # Seuil (montant) à partir duquel la forme abrégée est ajoutée.
  abbreviate_threshold: 1000000

# Tâches planifiées
tasks:
  # Intervalle de vérification des items expirés, en secondes.
  expiration_check_interval_seconds: 300 # 5 minutes

# Options diverses
misc:
  # Permettre d'annuler ses propres ventes
  allow_self_cancel: true
  # Permettre aux admins (permission shauctions.cancel.others) d'annuler les ventes des autres
  allow_admin_cancel: true
  # Logguer les transactions (achats) dans la console
  log_transactions: true
  # Son joué lors d'un achat réussi (vide pour aucun son)
  # Voir: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Sound.html
  sound_on_purchase: ENTITY_PLAYER_LEVELUP
  sound_on_sell: ENTITY_EXPERIENCE_ORB_PICKUP
  sound_on_cancel: BLOCK_ANVIL_LAND
  sound_on_expire_claim: ENTITY_ITEM_PICKUP

# Saisie par dialogue natif (clients 1.21.6 et plus) : montant d'une mise et raison d'une annulation staff.
# Les clients plus anciens (ou actif: false) gardent la saisie dans le chat (« annuler » pour abandonner).
# Les textes des dialogues se règlent dans messages.yml, section « dialogues ».
# Le montant saisi est revérifié par le serveur avec les mêmes règles qu'au chat (minimum, incrément, solde...).
dialogues:
  # false : tous les joueurs saisissent dans le chat
  actif: true
  # Version de protocole minimale du client pour recevoir un dialogue (771 = 1.21.6).
  # Sans ViaVersion, tous les clients sont considérés compatibles.
  min-protocol: 771
  # Durée de validité d'un dialogue ouvert, en secondes : passé ce délai, valider ne fait plus rien
  expiration-secondes: 300
  # Effet Cécité tant qu'un dialogue de ce plugin est affiché : le texte se lit sur fond noir. Il est retiré dès que le joueur
  # clique un bouton du dialogue (ou Échap quand il a un bouton en bas), sinon dès qu'il tourne la caméra, se déplace ou ouvre un inventaire.
  # Un joueur déjà aveugle pour une autre raison n'est pas touché.
  aveugler-pendant-dialogues: true

# Onglet « Recherches » (/hdv recherche) : les joueurs publient ce qu'ils cherchent, les autres les contactent
# par mail (même hors ligne). Aucun argent ni objet ne bouge. Publications et suppressions écrites dans la console.
recherches:
  actif: true
  # Recherches en cours par joueur (permission shauctions.recherches.max.<n> pour plus, jusqu'à 20)
  max-par-joueur: 3
  # Durée de vie d'une recherche, en heures
  duree-heures: 72
  # Délai minimal entre deux publications, en secondes (le staff n'y est pas soumis)
  delai-secondes: 30
  longueur-min: 3
  longueur-max: 80
  # Commande suggérée par le bouton « Lui écrire » (%auteur% = auteur de la recherche)
  commande-contact: '/mail %auteur% '
  # Mots refusés (contenus dans le texte, sans tenir compte des majuscules)
  mots-interdits:
    - discord.gg
    - http://
    - https://

# Lignes écrites dans SHLogs (plugins/SHLogs/SHAuctions/).
# file : nom du fichier de log. format : ligne écrite.
# %price% est le montant exact, sans arrondi à l'entier ni abréviation.
logs:
  # Mise en vente directe.
  # Variables : %player%, %amount%, %item%, %price%, %duration%.
  mises-en-vente:
    file: "mises-en-vente"
    format: "%player% -> met en vente %amount% x %item% (%price% pièces, durée %duration%)"
  # Mise aux enchères.
  # Variables : %player%, %amount%, %item%, %price% (prix de départ), %duration%.
  mises-aux-encheres:
    file: "mises-en-vente"
    format: "%player% -> met aux enchères %amount% x %item% (départ %price% pièces, durée %duration%)"
  # Achat d'une vente directe.
  # Variables : %buyer%, %seller%, %amount%, %item%, %price%.
  achats:
    file: "achats"
    format: "%buyer% -> achète %amount% x %item% à %seller% (%price% pièces)"
  # Enchère terminée avec un gagnant (enchères du serveur comprises, vendeur = encheres-serveur.vendeur).
  # Variables : %winner%, %seller%, %amount%, %item%, %price% (montant final).
  encheres:
    file: "encheres"
    format: "%winner% -> remporte %amount% x %item% de %seller% (%price% pièces)"
  # Mise acceptée sur une enchère.
  # Variables : %player%, %seller%, %amount%, %item%, %price% (montant misé).
  mises:
    file: "encheres"
    format: "%player% -> mise %price% pièces sur %amount% x %item% de %seller%"
  # Enchère du serveur mise en ligne.
  # Variables : %lot%, %item% (avec la quantité), %price% (départ), %duration%.
  encheres-serveur-lancement:
    file: "encheres-serveur"
    format: "%lot% -> mis aux enchères par le serveur : %item% (départ %price% pièces, durée %duration%)"
  # Lot remis au gagnant (commandes lancées), tout de suite ou quand il le récupère dans ses invendus.
  # Variables : %player%, %lot%, %item%.
  encheres-serveur-livraison:
    file: "encheres-serveur"
    format: "%player% -> reçoit le lot %lot% (%item%)"
  # Enchère du serveur terminée sans offre.
  # Variables : %item%, %price% (départ).
  encheres-serveur-sans-offre:
    file: "encheres-serveur"
    format: "%item% -> enchère du serveur terminée sans offre (départ %price% pièces)"
  # Vente du serveur mise en ligne.
  # Variables : %lot%, %item% (avec la quantité), %price%, %duration%.
  ventes-serveur-mise-en-vente:
    file: "ventes-serveur"
    format: "%lot% -> mis en vente par le serveur : %item% (%price% pièces, durée %duration%)"
  # Lot d'une vente du serveur remis à l'acheteur (commandes lancées), tout de suite ou quand il le récupère.
  # Variables : %player%, %lot%, %item%.
  ventes-serveur-livraison:
    file: "ventes-serveur"
    format: "%player% -> reçoit le lot %lot% (%item%)"
  # Vente du serveur terminée sans acheteur.
  # Variables : %item%, %price%.
  ventes-serveur-invendue:
    file: "ventes-serveur"
    format: "%item% -> vente du serveur terminée sans acheteur (%price% pièces)"
  # Annonce retirée par son vendeur.
  # Variables : %player%, %amount%, %item%.
  retraits:
    file: "retraits"
    format: "%player% -> retire son annonce (%amount% x %item%)"
  # Objet récupéré dans le menu des invendus.
  # Variables : %player%, %amount%, %item%.
  retraits-invendus:
    file: "retraits"
    format: "%player% -> récupère ses invendus (%amount% x %item%)"
  # Annonce annulée par le staff.
  # Variables : %staff%, %seller%, %amount%, %item%, %reason%.
  staff:
    file: "staff"
    format: "%staff% -> annule l'annonce de %seller% (%amount% x %item%, raison : %reason%)"
