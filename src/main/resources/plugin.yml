name: SHAuctions
version: '${project.version}'
main: org.Cry_Legende.sHAuctions.SHAuctions
api-version: '1.20'
author: Cry_Legende
softdepend: [Vault, ViaVersion, SHLogs, SHNetwork] # Vault : économie (fortement recommandé) ; ViaVersion : version du client pour les dialogues ; SHLogs : journal des actions ; SHNetwork : HDV commun à plusieurs serveurs
# Chargées par Paper dans le classloader du plugin : le serveur n'embarque que les pilotes MySQL et SQLite.
# Seul le mode réseau (base MariaDB partagée) s'en sert.
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.4.1

commands:
  hdv: # Ou 'ah', 'auction', etc.
    description: Ouvre l'hôtel des ventes ou gère les enchères.
    usage: "/hdv [sell|bid|history|expired|ownsales|recherche]"
    aliases: [ah, auctionhouse]
  shauctions:
    description: Administration de SHAuctions (reload, info).
    usage: /shauctions <reload|info>
    permission: shauctions.admin.reload;shauctions.admin.info

permissions:
  shauctions.use:
    description: Permet d'utiliser les fonctionnalités de base de l'HDV (ouvrir, voir).
    default: true
  shauctions.sell:
    description: Permet de mettre des items en vente.
    default: true
  shauctions.buy:
    description: Permet d'acheter des items.
    default: true
  shauctions.bid:
    description: Permet de mettre des items aux enchères et de miser.
    default: true
  shauctions.menu.bids:
    description: Permet d'ouvrir la page des Enchères.
    default: true
  shauctions.menu.ownsales:
    description: Affiche le bouton "Vos objets en vente" dans les menus.
    default: true
  shauctions.menu.expired:
    description: Affiche le bouton "Vos invendus" dans les menus.
    default: true
  shauctions.menu.history:
    description: Affiche le bouton "Historique des ventes" dans les menus.
    default: true
  shauctions.history.self:
    description: Permet de voir son propre historique de ventes.
    default: true
  shauctions.history.global:
    description: Permet de voir l'historique global des ventes.
    default: op
  shauctions.expired.claim:
    description: Permet de réclamer ses items expirés.
    default: true
  shauctions.cancel.self:
    description: Permet d'annuler ses propres ventes.
    default: true
  shauctions.cancel.others:
    description: Permet d'annuler les ventes des autres joueurs (admin).
    default: op
  shauctions.ownsales.view:
    description: Permet d'utiliser la commande /hdv ownsales (le bouton des menus passe par shauctions.menu.ownsales).
    default: op
  shauctions.admin:
    description: Toute l'administration de SHAuctions.
    default: op
    children:
      shauctions.admin.reload: true
      shauctions.admin.info: true
  shauctions.admin.reload:
    description: Recharger config.yml, messages.yml et les menus (/shauctions reload).
    default: op
  shauctions.admin.info:
    description: Voir les ventes, enchères et invendus d'un joueur (/shauctions info).
    default: op
  shauctions.recherches.use:
    description: Onglet Recherches de l'HDV (voir, publier, contacter, supprimer les siennes).
    default: true
  shauctions.recherches.admin:
    description: Supprimer n'importe quelle recherche, sans délai entre deux publications.
    default: op
  # Paliers (nœuds construits à partir d'un nombre, non déclarés) :
  #   shauctions.limit.<n> (ou unlimited, *)     ventes simultanées, exemple shauctions.limit.4
  #   shauctions.bidlimit.<n> (ou unlimited, *)  enchères simultanées, exemple shauctions.bidlimit.1
  #   shauctions.recherches.max.<n>              recherches en cours, exemple shauctions.recherches.max.6
